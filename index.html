<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Room AV Setup</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #081a32, #0c5fa8);
            color: white;
        }

        header {
            text-align: center;
            padding: 30px;
        }

        .logos {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .logos img {
            height: 90px;
            object-fit: contain;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        #search {
            width: 450px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: rgba(255,255,255,0.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .thumbnail {
            height: 220px;
            position: relative;
            overflow: hidden;
        }

        .room-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .card:hover .room-image {
            transform: scale(1.08);
        }

        .room-name-overlay {

            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            padding: 15px;

            background: linear-gradient(
                transparent,
                rgba(0,0,0,0.9)
            );

            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .details {
            padding: 20px;
        }

        .capacity {

            display: inline-block;

            background: #00c853;

            padding: 8px 15px;

            border-radius: 20px;
        }

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .buttons a {

            flex: 1;

            text-decoration: none;

            color: white;

            text-align: center;

            padding: 12px;

            border-radius: 10px;
        }

        .view {
            background: #1976d2;
        }

        .download {
            background: #00a152;
        }

        footer {

            text-align: center;

            padding: 30px;
        }

    </style>

</head>

<body>

<header>

    <div class="logos">

        <img src="myk-logo.jpg">

        <img src="arment-logo.png">

    </div>

    <h1>Meeting Room AV Setup</h1>

    <p class="subtitle">

        Select a meeting room to view AV instructions

    </p>

    <input

        type="text"

        id="search"

        placeholder="Search room..."

        onkeyup="searchRooms()">

</header>

<div class="container" id="container"></div>

<footer>

    © MYK Arment

</footer>

<script>

const rooms = [

["Training Room 1","16 Pax"],
["Training Room 2","16 Pax"],
["Bharatanatyam","8 Pax"],
["Kuchipudi","8 Pax"],
["Kathakali","8 Pax"],
["Manipuri","8 Pax"],
["Kalbelia","8 Pax"],
["Ghoomar","8 Pax"],
["India Gate","3 Pax"],
["Rani Ki Vav","3 Pax"],
["Kumbhalgarh fort","3 Pax"],
["Sanchi Stupa","3 Pax"],
["Khajuraho temple","3 Pax"],
["Ajanta Ellora caves","3 Pax"],
["Thousand Pillars temple","3 Pax"],
["Shore temple","3 Pax"],
["Stone Chariot","4 Pax"],
["Charminar","4 Pax"],
["Konark Sun temple","4 Pax"],
["Fatehpur sikri","4 Pax"],
["Hawa Mahal","3 Pax"],
["Falaknuma Palace","3 Pax"],
["Brihadeeswarar temple","3 Pax"]

];

function fileName(name) {

    return name
        .toLowerCase()
        .replaceAll(" ", "-");

}

function createCard(name, pax) {

    const file = fileName(name);

    return `

    <div class="card">

        <div class="thumbnail">

            <img

                class="room-image"

                src="${file}.jpg"

                alt="${name}"

                onerror="this.src='default.jpg'"

            >

            <div class="room-name-overlay">

                ${name}

            </div>

        </div>

        <div class="details">

            <span class="capacity">

                ${pax}

            </span>

            <div class="buttons">

                <a

                    class="view"

                    href="docs/${file}.pdf"

                    target="_blank">

                    View PDF

                </a>

                <a

                    class="download"

                    href="docs/${file}.pdf"

                    download>

                    Download

                </a>

            </div>

        </div>

    </div>

    `;

}

function render(data) {

    const container = document.getElementById("container");

    container.innerHTML = "";

    data.forEach(room => {

        container.innerHTML += createCard(room[0], room[1]);

    });

}

function searchRooms() {

    const text = document
        .getElementById("search")
        .value
        .toLowerCase();

    const filtered = rooms.filter(room =>

        room[0].toLowerCase().includes(text)

    );

    render(filtered);

}

render(rooms);

</script>

</body>

</html>

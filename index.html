<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MYK Meeting Room AV Setup</title>

    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Arial, sans-serif;

        }

        body {

            background:
                linear-gradient(
                    135deg,
                    #071428,
                    #0f4c81
                );

            color: white;

            transition: 0.5s;

        }

        body.light {

            background: #f4f6f9;
            color: #222;

        }

        header {

            padding: 30px;
            text-align: center;

        }

        .logo-section {

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;

        }

        .logo-section img {

            height: 90px;

        }

        h1 {

            margin-top: 20px;
            font-size: 42px;

        }

        .subtitle {

            opacity: 0.8;
            margin-top: 10px;
            margin-bottom: 20px;

        }

        .toolbar {

            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;

        }

        #search {

            width: 420px;
            max-width: 90%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 16px;

        }

        .toggle {

            border: none;
            border-radius: 30px;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;

        }

        .container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );

            gap: 25px;

            padding: 30px;

        }

        .card {

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);

            transition: 0.5s;

            transform-style: preserve-3d;

        }

        .card:hover {

            transform:
                perspective(1200px)
                rotateY(-10deg)
                rotateX(5deg)
                scale(1.03);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.5);

        }

        .image-box {

            position: relative;

            height: 240px;

            overflow: hidden;

        }

        .room-image {

            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: 0.7s;

        }

        .card:hover .room-image {

            transform: scale(1.1);

        }

        .overlay {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 20px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.85)
                );

        }

        .overlay h2 {

            font-size: 24px;
            margin-bottom: 10px;

        }

        .capacity {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.2);

            backdrop-filter: blur(10px);

        }

        .buttons {

            display: flex;
            gap: 10px;

            padding: 15px;

        }

        .buttons a {

            flex: 1;

            text-decoration: none;

            color: white;

            text-align: center;

            padding: 12px;

            border-radius: 10px;

            font-weight: bold;

        }

        .view {

            background: #1976d2;

        }

        .download {

            background: #00a152;

        }

        footer {

            text-align: center;

            padding: 25px;

            opacity: 0.8;

        }

        @media (max-width: 768px) {

            h1 {

                font-size: 30px;

            }

            .logo-section img {

                height: 70px;

            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo-section">

        <img src="myk-logo.jpg">

        <img src="arment-logo.png">

    </div>

    <h1>Meeting Room AV Setup</h1>

    <p class="subtitle">

        View and download AV setup documents

    </p>

    <div class="toolbar">

        <input
            id="search"
            type="text"
            placeholder="🔍 Search meeting room..."
            onkeyup="searchRooms()">

        <button
            class="toggle"
            onclick="toggleTheme()">

            🌙 Toggle Theme

        </button>

    </div>

</header>

<div class="container" id="roomsContainer"></div>

<footer>

    © MYK Arment Meeting Room Portal

</footer>

<script>

const rooms = [

    ["Training Room 1", "16 Pax"],
    ["Training Room 2", "16 Pax"],
    ["Bharatanatyam", "8 Pax"],
    ["Kuchipudi", "8 Pax"],
    ["Kathakali", "8 Pax"],
    ["Manipuri", "8 Pax"],
    ["Kalbelia", "8 Pax"],
    ["Ghoomar", "8 Pax"],
    ["India Gate", "3 Pax"],
    ["Rani Ki Vav", "3 Pax"],
    ["Kumbhalgarh Fort", "3 Pax"],
    ["Sanchi Stupa", "3 Pax"],
    ["Khajuraho Temple", "3 Pax"],
    ["Ajanta Ellora Caves", "3 Pax"],
    ["Thousand Pillars Temple", "3 Pax"],
    ["Shore Temple", "3 Pax"],
    ["Stone Chariot", "4 Pax"],
    ["Charminar", "4 Pax"],
    ["Konark Sun Temple", "4 Pax"],
    ["Fatehpur Sikri", "4 Pax"],
    ["Hawa Mahal", "3 Pax"],
    ["Falaknuma Palace", "3 Pax"],
    ["Brihadeeswarar Temple", "3 Pax"]

];

function fileName(name) {

    return name
        .toLowerCase()
        .replaceAll(" ", "-");

}

function createCard(name, pax) {

    const file = fileName(name);

    return `

        <div class="card">

            <div class="image-box">

                <img

                    class="room-image"

                    src="images/${file}.jpg"

                    onerror="this.src='images/default.jpg'"

                >

                <div class="overlay">

                    <h2>${name}</h2>

                    <span class="capacity">

                        ${pax}

                    </span>

                </div>

            </div>

            <div class="buttons">

                <a

                    class="view"

                    href="docs/${file}.pdf"

                    target="_blank">

                    View

                </a>

                <a

                    class="download"

                    href="docs/${file}.pdf"

                    download>

                    Download

                </a>

            </div>

        </div>

    `;

}

function render(list) {

    const container =

        document.getElementById(

            "roomsContainer"

        );

    container.innerHTML = "";

    list.forEach(room => {

        container.innerHTML +=

            createCard(

                room[0],

                room[1]

            );

    });

}

function searchRooms() {

    const value =

        document
        .getElementById("search")
        .value
        .toLowerCase();

    render(

        rooms.filter(

            room =>

                room[0]

                .toLowerCase()

                .includes(value)

        )

    );

}

function toggleTheme() {

    document.body.classList.toggle(

        "light"

    );

}

render(rooms);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Room AV Setup</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            background: linear-gradient(135deg, #081a32, #0d47a1);
            color: white;
            min-height: 100vh;
        }

        header {

            text-align: center;
            padding: 30px;
        }

        .logo-container {

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .logo-container img {

            height: 90px;
        }

        h1 {

            margin-bottom: 15px;
            font-size: 42px;
        }

        #search {

            width: 450px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .container {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;

            padding: 30px;
        }

        .card {

            background: rgba(255,255,255,0.08);

            border-radius: 25px;

            overflow: hidden;

            backdrop-filter: blur(15px);

            transition: 0.5s;

            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        .card:hover {

            transform:
                perspective(1000px)
                rotateY(-6deg)
                rotateX(5deg)
                scale(1.03);

            box-shadow:
                0 25px 40px rgba(0,0,0,0.5);
        }

        .image-box {

            position: relative;

            height: 240px;

            overflow: hidden;
        }

        .room-image {

            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: 0.5s;
        }

        .card:hover .room-image {

            transform: scale(1.1);
        }

        .overlay {

            position: absolute;

            bottom: 0;

            left: 0;

            right: 0;

            padding: 20px;

            background:

                linear-gradient(

                    transparent,

                    rgba(0,0,0,0.9)

                );
        }

        .overlay h2 {

            margin-bottom: 10px;
        }

        .capacity {

            background: #00c853;

            padding: 8px 14px;

            border-radius: 20px;
        }

        .buttons {

            display: flex;

            gap: 10px;

            padding: 15px;
        }

        .buttons a {

            flex: 1;

            text-align: center;

            text-decoration: none;

            color: white;

            padding: 12px;

            border-radius: 10px;

            font-weight: bold;
        }

        .view {

            background: #1976d2;
        }

        .download {

            background: #00a152;
        }

        footer {

            text-align: center;

            padding: 30px;
        }

    </style>

</head>

<body>

<header>

    <div class="logo-container">

        <img src="myk-logo.jpg">

        <img src="arment-logo.png">

    </div>

    <h1>Meeting Room AV Setup</h1>

    <input

        type="text"

        id="search"

        placeholder="Search meeting room..."

        onkeyup="searchRooms()">

</header>

<div

    class="container"

    id="roomsContainer">

</div>

<footer>

    © MYK Arment

</footer>

<script>

const rooms = [

["Training Room 1","16 Pax"],
["Training Room 2","16 Pax"],
["Bharatanatyam","8 Pax"],
["Kuchipudi","8 Pax"],
["Kathakali","8 Pax"],
["Manipuri","8 Pax"],
["Kalbelia","8 Pax"],
["Ghoomar","8 Pax"],
["India Gate","3 Pax"],
["Rani Ki Vav","3 Pax"],
["Kumbhalgarh Fort","3 Pax"],
["Sanchi Stupa","3 Pax"],
["Khajuraho Temple","3 Pax"],
["Ajanta Ellora Caves","3 Pax"],
["Thousand Pillars Temple","3 Pax"],
["Shore Temple","3 Pax"],
["Stone Chariot","4 Pax"],
["Charminar","4 Pax"],
["Konark Sun Temple","4 Pax"],
["Fatehpur Sikri","4 Pax"],
["Hawa Mahal","3 Pax"],
["Falaknuma Palace","3 Pax"],
["Brihadeeswarar Temple","3 Pax"]

];

function fileName(name) {

    return name

        .toLowerCase()

        .replace(/\s+/g, "-");
}

function createCard(name, pax) {

    const file = fileName(name);

    return `

    <div class="card">

        <div class="image-box">

            <img

                class="room-image"

                src="images/${file}.jpg"

                alt="${name}"

                onerror="this.src='images/default.jpg'">

            <div class="overlay">

                <h2>${name}</h2>

                <span class="capacity">

                    ${pax}

                </span>

            </div>

        </div>

        <div class="buttons">

            <a

                class="view"

                href="docs/${file}.pdf"

                target="_blank">

                View PDF

            </a>

            <a

                class="download"

                href="docs/${file}.pdf"

                download>

                Download

            </a>

        </div>

    </div>

    `;
}

function render(list) {

    const container =

        document.getElementById(

            "roomsContainer"

        );

    container.innerHTML = "";

    list.forEach(room => {

        container.innerHTML +=

            createCard(

                room[0],

                room[1]

            );
    });
}

function searchRooms() {

    const text =

        document

            .getElementById("search")

            .value

            .toLowerCase();

    const filtered =

        rooms.filter(

            room =>

                room[0]

                .toLowerCase()

                .includes(text)

        );

    render(filtered);
}

render(rooms);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Room AV Setup</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            background: linear-gradient(135deg, #081b33, #0d47a1);
            color: white;
            min-height: 100vh;

        }

        header {

            text-align: center;
            padding: 30px;

        }

        h1 {

            margin-bottom: 20px;
            font-size: 40px;

        }

        #search {

            width: 450px;
            max-width: 90%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 16px;

        }

        .container {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;

            padding: 30px;

        }

        .card {

            background: rgba(255,255,255,0.1);

            border-radius: 20px;

            overflow: hidden;

            backdrop-filter: blur(15px);

            transition: 0.5s;

            box-shadow: 0 10px 30px rgba(0,0,0,0.4);

        }

        .card:hover {

            transform: scale(1.03);

        }

        .image-box {

            width: 100%;
            height: 220px;

            overflow: hidden;

        }

        .room-image {

            width: 100%;
            height: 100%;
            object-fit: cover;

        }

        .overlay {

            padding: 20px;

        }

        .overlay h2 {

            margin-bottom: 10px;

        }

        .capacity {

            background: green;

            padding: 8px 15px;

            border-radius: 20px;

        }

        .buttons {

            display: flex;

            gap: 10px;

            padding: 15px;

        }

        .buttons a {

            flex: 1;

            text-decoration: none;

            text-align: center;

            color: white;

            padding: 12px;

            border-radius: 8px;

        }

        .view {

            background: #1565c0;

        }

        .download {

            background: #2e7d32;

        }

    </style>

</head>

<body>

<header>

    <h1>Meeting Room AV Setup</h1>

    <input

        id="search"

        type="text"

        placeholder="Search room..."

        onkeyup="searchRooms()">

</header>

<div id="roomsContainer" class="container"></div>

<script>

const rooms = [

    ["Training Room 1", "16 Pax"],
    ["Training Room 2", "16 Pax"],
    ["Bharatanatyam", "8 Pax"],
    ["Kuchipudi", "8 Pax"],
    ["Kathakali", "8 Pax"],
    ["Manipuri", "8 Pax"],
    ["Kalbelia", "8 Pax"],
    ["Ghoomar", "8 Pax"],
    ["India Gate", "3 Pax"],
    ["Rani Ki Vav", "3 Pax"],
    ["Kumbhalgarh Fort", "3 Pax"],
    ["Sanchi Stupa", "3 Pax"],
    ["Khajuraho Temple", "3 Pax"],
    ["Ajanta Ellora Caves", "3 Pax"],
    ["Thousand Pillars Temple", "3 Pax"],
    ["Shore Temple", "3 Pax"],
    ["Stone Chariot", "4 Pax"],
    ["Charminar", "4 Pax"],
    ["Konark Sun Temple", "4 Pax"],
    ["Fatehpur Sikri", "4 Pax"],
    ["Hawa Mahal", "3 Pax"],
    ["Falaknuma Palace", "3 Pax"],
    ["Brihadeeswarar Temple", "3 Pax"]

];

function fileName(name) {

    return name
        .toLowerCase()
        .replace(/\s+/g, "-");

}

function createCard(name, pax) {

    const file = fileName(name);

    return `

    <div class="card">

        <div class="image-box">

            <img

                class="room-image"

                src="images/${file}.jpg"

                alt="${name}"

                onerror="this.src='images/default.jpg'"

            >

        </div>

        <div class="overlay">

            <h2>${name}</h2>

            <span class="capacity">

                ${pax}

            </span>

        </div>

        <div class="buttons">

            <a

                class="view"

                href="docs/${file}.pdf"

                target="_blank">

                View

            </a>

            <a

                class="download"

                href="docs/${file}.pdf"

                download>

                Download

            </a>

        </div>

    </div>

    `;

}

function render(list) {

    const container =

        document.getElementById(

            "roomsContainer"

        );

    container.innerHTML = "";

    list.forEach(room => {

        container.innerHTML +=

            createCard(

                room[0],

                room[1]

            );

    });

}

function searchRooms() {

    const text =

        document
            .getElementById("search")
            .value
            .toLowerCase();

    const filtered =

        rooms.filter(

            room =>

                room[0]
                .toLowerCase()
                .includes(text)

        );

    render(filtered);

}

render(rooms);

</script>

</body>

</html>

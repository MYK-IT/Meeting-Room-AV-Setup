<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meeting Room AV Setup</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, sans-serif;
        }

        body {

            background: linear-gradient(135deg, #081a32, #0c5fa8);

            color: white;

            transition: 0.4s;
        }

        body.light {

            background: #f4f7fc;

            color: black;
        }

        header {

            text-align: center;

            padding: 30px;
        }

        .logos {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 40px;

            flex-wrap: wrap;

            margin-bottom: 25px;
        }

        .logos img {

            height: 90px;

            object-fit: contain;
        }

        h1 {

            font-size: 40px;

            margin-bottom: 10px;
        }

        .subtitle {

            opacity: 0.8;

            margin-bottom: 25px;
        }

        .controls {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        #search {

            width: 450px;

            max-width: 90%;

            padding: 14px;

            border-radius: 30px;

            border: none;

            outline: none;

            font-size: 16px;
        }

        .theme-btn {

            border: none;

            padding: 14px 20px;

            border-radius: 30px;

            background: white;

            cursor: pointer;

            font-weight: bold;
        }

        .container {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;

            padding: 30px;
        }

        .card {

            background: rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);

            border-radius: 24px;

            overflow: hidden;

            transition: 0.4s;

            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .card:hover {

            transform: translateY(-10px) scale(1.02);

            box-shadow: 0 20px 40px rgba(0,0,0,0.45);
        }

        .thumbnail {

            height: 220px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            position: relative;
        }

        .silhouette {

            position: absolute;

            font-size: 140px;

            opacity: 0.15;
        }

        .icon {

            font-size: 70px;

            z-index: 1;

            animation: pulse 2s infinite;
        }

        .room-name {

            margin-top: 15px;

            font-size: 22px;

            font-weight: bold;

            z-index: 1;

            text-align: center;

            padding: 0 10px;
        }

        .details {

            padding: 20px;
        }

        .capacity {

            display: inline-block;

            background: #00c853;

            padding: 8px 15px;

            border-radius: 20px;
        }

        .buttons {

            margin-top: 20px;

            display: flex;

            gap: 10px;
        }

        .buttons a {

            flex: 1;

            text-decoration: none;

            color: white;

            text-align: center;

            padding: 12px;

            border-radius: 10px;
        }

        .view {

            background: #1976d2;
        }

        .download {

            background: #00a152;
        }

        footer {

            text-align: center;

            padding: 30px;
        }

        @keyframes pulse {

            50% {

                transform: scale(1.1);
            }
        }

    </style>

</head>

<body>

<header>

    <div class="logos">

        <img src="myk-logo.jpg">

        <img src="arment-logo.png">

    </div>

    <h1>Meeting Room AV Setup</h1>

    <p class="subtitle">

        Select a meeting room to view or download the AV document

    </p>

    <div class="controls">

        <input

            type="text"

            id="search"

            placeholder="🔍 Search meeting room..."

            onkeyup="searchRooms()">

        <button class="theme-btn"

                onclick="toggleTheme()">

            🌙 Toggle Theme

        </button>

    </div>

</header>

<div class="container" id="container"></div>

<footer>

    © MYK Arment Meeting Room AV Setup

</footer>

<script>

const rooms = [

["Training Room 1","16 Pax"],
["Training Room 2","16 Pax"],
["Bharatanatyam","8 Pax"],
["Kuchipudi","8 Pax"],
["Kathakali","8 Pax"],
["Manipuri","8 Pax"],
["Kalbelia","8 Pax"],
["Ghoomar","8 Pax"],
["India Gate","3 Pax"],
["Rani Ki Vav","3 Pax"],
["Kumbhalgarh fort","3 Pax"],
["Sanchi Stupa","3 Pax"],
["Khajuraho temple","3 Pax"],
["Ajanta Ellora caves","3 Pax"],
["Thousand Pillars temple","3 Pax"],
["Shore temple","3 Pax"],
["Stone Chariot","4 Pax"],
["Charminar","4 Pax"],
["Konark Sun temple","4 Pax"],
["Fatehpur sikri","4 Pax"],
["Hawa Mahal","3 Pax"],
["Falaknuma Palace","3 Pax"],
["Brihadeeswarar temple","3 Pax"]

];

function getStyle(name) {

    if (name.includes("Training"))

        return {

            icon: "📚",

            shadow: "🎓",

            color: "linear-gradient(135deg,#1565C0,#42A5F5)"

        };

    if (

        ["Bharatanatyam","Kuchipudi","Kathakali","Manipuri","Kalbelia","Ghoomar"]

        .includes(name)

    )

        return {

            icon: "💃",

            shadow: "✨",

            color: "linear-gradient(135deg,#8E24AA,#D81B60)"

        };

    if (

        name.includes("Temple") ||

        name.includes("Stupa")

    )

        return {

            icon: "🏛️",

            shadow: "🕍",

            color: "linear-gradient(135deg,#FF9800,#FFC107)"

        };

    if (

        name.includes("Fort") ||

        name.includes("Palace")

    )

        return {

            icon: "🏰",

            shadow: "🏯",

            color: "linear-gradient(135deg,#795548,#A1887F)"

        };

    return {

        icon: "🕌",

        shadow: "🌆",

        color: "linear-gradient(135deg,#00897B,#26A69A)"

    };
}

function fileName(name) {

    return name.toLowerCase().replaceAll(" ", "-");

}

function createCard(name, pax) {

    const s = getStyle(name);

    return `

        <div class="card">

            <div class="thumbnail"

                 style="background:${s.color}">

                <div class="silhouette">

                    ${s.shadow}

                </div>

                <div class="icon">

                    ${s.icon}

                </div>

                <div class="room-name">

                    ${name}

                </div>

            </div>

            <div class="details">

                <span class="capacity">

                    ${pax}

                </span>

                <div class="buttons">

                    <a

                        class="view"

                        href="docs/${fileName(name)}.pdf"

                        target="_blank">

                        View PDF

                    </a>

                    <a

                        class="download"

                        href="docs/${fileName(name)}.pdf"

                        download>

                        Download

                    </a>

                </div>

            </div>

        </div>

    `;

}

function render(data) {

    const container =

        document.getElementById("container");

    container.innerHTML = "";

    data.forEach(room => {

        container.innerHTML +=

            createCard(room[0], room[1]);

    });

}

function searchRooms() {

    const text =

        document.getElementById("search")

        .value

        .toLowerCase();

    render(

        rooms.filter(r =>

            r[0].toLowerCase().includes(text)

        )

    );

}

function toggleTheme() {

    document.body.classList.toggle("light");

}

render(rooms);

</script>

</body>

</html>
